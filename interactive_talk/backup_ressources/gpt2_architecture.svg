<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 600"
     font-family="Iosevka, 'JetBrains Mono', monospace">

  <!--
    Hand-authored capstone figure for the transformer section.
    Shows GPT-2 small data flow: token IDs → embedding → 12 transformer
    blocks → unembedding → softmax. Shapes and parameter counts appear
    as layered reveals. A block-zoom layer expands one transformer
    block into its attention + MLP sub-operations.

    Layers:
      - shapes      : shape annotations at each pipeline stage
      - params      : parameter counts per stage + grand total
      - block-zoom  : expanded view of one transformer block
  -->

  <!-- ================================================================ -->
  <!-- BASE: title + main pipeline + tied-weights arc                   -->
  <!-- ================================================================ -->

  <text x="380" y="34" text-anchor="middle"
        fill="#b8b8b8" font-size="17px" font-weight="500">
    GPT-2 small — data flow
  </text>

  <!-- Pipeline boxes (y: 70–120, height 50, centered at y=95) -->

  <!-- Box 1 : Token IDs -->
  <rect x="18" y="70" width="100" height="50" rx="3"
        fill="none" stroke="#e8e8e8" stroke-width="1.2"/>
  <text x="68" y="91" text-anchor="middle" fill="#e8e8e8" font-size="12px">token ids</text>
  <text x="68" y="108" text-anchor="middle" fill="#8a8a8a" font-size="10px">integers</text>

  <!-- Arrow 1 -->
  <line x1="118" y1="95" x2="146" y2="95" stroke="#e8e8e8" stroke-width="1.1"/>
  <polygon points="150,95 143,91 143,99" fill="#e8e8e8"/>

  <!-- Box 2 : wte + wpe -->
  <rect x="150" y="70" width="120" height="50" rx="3"
        fill="none" stroke="#e8e8e8" stroke-width="1.2"/>
  <text x="210" y="91" text-anchor="middle" fill="#e8e8e8" font-size="12px">wte + wpe</text>
  <text x="210" y="108" text-anchor="middle" fill="#8a8a8a" font-size="10px">embed lookup</text>

  <!-- Arrow 2 -->
  <line x1="270" y1="95" x2="298" y2="95" stroke="#e8e8e8" stroke-width="1.1"/>
  <polygon points="302,95 295,91 295,99" fill="#e8e8e8"/>

  <!-- Box 3 : Transformer block ×12 (highlighted, taller) -->
  <rect x="302" y="62" width="160" height="66" rx="3"
        fill="none" stroke="#e8e8e8" stroke-width="1.6"/>
  <text x="382" y="86" text-anchor="middle" fill="#e8e8e8" font-size="12px">transformer block</text>
  <text x="382" y="105" text-anchor="middle" fill="#fbbf24" font-size="14px" font-weight="500">× 12</text>
  <text x="382" y="121" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">attn + MLP on residual</text>

  <!-- Arrow 3 -->
  <line x1="462" y1="95" x2="490" y2="95" stroke="#e8e8e8" stroke-width="1.1"/>
  <polygon points="494,95 487,91 487,99" fill="#e8e8e8"/>

  <!-- Box 4 : Unembedding -->
  <rect x="494" y="70" width="120" height="50" rx="3"
        fill="none" stroke="#e8e8e8" stroke-width="1.2"/>
  <text x="554" y="91" text-anchor="middle" fill="#e8e8e8" font-size="12px">unembedding</text>
  <text x="554" y="108" text-anchor="middle" fill="#8a8a8a" font-size="10px">(tied wte.T)</text>

  <!-- Arrow 4 -->
  <line x1="614" y1="95" x2="642" y2="95" stroke="#e8e8e8" stroke-width="1.1"/>
  <polygon points="646,95 639,91 639,99" fill="#e8e8e8"/>

  <!-- Box 5 : Softmax → top-k -->
  <rect x="646" y="70" width="100" height="50" rx="3"
        fill="none" stroke="#e8e8e8" stroke-width="1.2"/>
  <text x="696" y="91" text-anchor="middle" fill="#e8e8e8" font-size="12px">softmax</text>
  <text x="696" y="108" text-anchor="middle" fill="#8a8a8a" font-size="10px">→ top-k</text>

  <!-- ================================================================ -->
  <!-- LAYER : shapes                                                   -->
  <!-- ================================================================ -->

  <g class="layer" id="shapes">
    <!-- Under each box -->
    <text x="68"  y="150" text-anchor="middle" fill="#fbbf24" font-size="12px">(T,)</text>
    <text x="68"  y="165" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">vocab: 50 257</text>

    <text x="210" y="150" text-anchor="middle" fill="#fbbf24" font-size="12px">(T, 768)</text>
    <text x="210" y="165" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">one vector / token</text>

    <text x="382" y="150" text-anchor="middle" fill="#fbbf24" font-size="12px">(T, 768)</text>
    <text x="382" y="165" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">residual stream</text>

    <text x="554" y="150" text-anchor="middle" fill="#fbbf24" font-size="12px">(T, 50 257)</text>
    <text x="554" y="165" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">logits over vocab</text>

    <text x="696" y="150" text-anchor="middle" fill="#fbbf24" font-size="12px">probs</text>
    <text x="696" y="165" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">→ next token</text>
  </g>

  <!-- ================================================================ -->
  <!-- LAYER : params                                                   -->
  <!-- ================================================================ -->

  <g class="layer" id="params">
    <text x="210" y="193" text-anchor="middle" fill="#e8e8e8" font-size="12px">39.4M params</text>
    <text x="210" y="207" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">wte 38.6M + wpe 0.8M</text>

    <text x="382" y="193" text-anchor="middle" fill="#e8e8e8" font-size="12px">~85M params</text>
    <text x="382" y="207" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">~7.1M × 12 blocks</text>

    <text x="554" y="193" text-anchor="middle" fill="#8a8a8a" font-size="11px">0 extra</text>
    <text x="554" y="207" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">(tied with wte)</text>

    <!-- Tied-weights arc + label: structural symmetry (appears with param counts) -->
    <path d="M 210 70 Q 382 52 554 70" fill="none"
          stroke="#666" stroke-width="0.9" stroke-dasharray="3,3"/>
    <text x="382" y="58" text-anchor="middle" fill="#8a8a8a" font-size="10px" font-style="italic">
      same 50 257 × 768 matrix (tied weights)
    </text>

    <!-- Grand total punchline at the bottom of the canvas -->
    <text x="380" y="572" text-anchor="middle" fill="#fbbf24" font-size="17px" font-weight="500">
      ~124M parameters total
    </text>
    <text x="380" y="590" text-anchor="middle" fill="#8a8a8a" font-size="11px" font-style="italic">
      embeddings ≈ 40M  ·  transformer blocks ≈ 85M
    </text>
  </g>

  <!-- ================================================================ -->
  <!-- LAYER : block-zoom — one transformer block expanded              -->
  <!-- ================================================================ -->

  <g class="layer" id="block-zoom">

    <!-- Dashed connectors from the ×12 box down to the expanded view -->
    <path d="M 302 128 L 40 238" fill="none" stroke="#666"
          stroke-width="0.9" stroke-dasharray="2,3"/>
    <path d="M 462 128 L 720 238" fill="none" stroke="#666"
          stroke-width="0.9" stroke-dasharray="2,3"/>

    <!-- Divider + subtitle -->
    <line x1="40" y1="230" x2="720" y2="230" stroke="#2a2a2a" stroke-width="1"/>
    <text x="380" y="255" text-anchor="middle" fill="#b8b8b8"
          font-size="13px" font-weight="500">
      inside one transformer block
    </text>

    <!-- ==============  ATTENTION ROW  ============== -->
    <!-- y band 280–345 -->

    <!-- Left residual label -->
    <text x="40"  y="316" fill="#8a8a8a" font-size="10.5px">residual</text>
    <text x="40"  y="329" fill="#666"    font-size="9px">(T, 768)</text>

    <!-- Right residual' label -->
    <text x="720" y="316" text-anchor="end" fill="#8a8a8a" font-size="10.5px">residual'</text>
    <text x="720" y="329" text-anchor="end" fill="#666"    font-size="9px">(T, 768)</text>

    <!-- Input arrow -->
    <line x1="92" y1="312" x2="112" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="116,312 109,308 109,316" fill="#e8e8e8"/>

    <!-- Box A1 : c_attn -->
    <rect x="116" y="292" width="92" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="162" y="309" text-anchor="middle" fill="#e8e8e8" font-size="11px">c_attn</text>
    <text x="162" y="324" text-anchor="middle" fill="#fbbf24" font-size="9.5px">768 → 2304</text>

    <line x1="208" y1="312" x2="224" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="228,312 221,308 221,316" fill="#e8e8e8"/>

    <!-- Box A2 : Q, K, V × 12 heads -->
    <rect x="228" y="292" width="108" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="282" y="308" text-anchor="middle" fill="#e8e8e8" font-size="11px">Q, K, V × 12</text>
    <text x="282" y="324" text-anchor="middle" fill="#fbbf24" font-size="9.5px">each (T, 12, 64)</text>

    <line x1="336" y1="312" x2="352" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="356,312 349,308 349,316" fill="#e8e8e8"/>

    <!-- Box A3 : attention compute -->
    <rect x="356" y="292" width="110" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="411" y="308" text-anchor="middle" fill="#e8e8e8" font-size="11px">attention</text>
    <text x="411" y="324" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">softmax(QKᵀ) V</text>

    <line x1="466" y1="312" x2="482" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="486,312 479,308 479,316" fill="#e8e8e8"/>

    <!-- Box A4 : c_proj -->
    <rect x="486" y="292" width="92" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="532" y="309" text-anchor="middle" fill="#e8e8e8" font-size="11px">c_proj</text>
    <text x="532" y="324" text-anchor="middle" fill="#fbbf24" font-size="9.5px">768 → 768</text>

    <line x1="578" y1="312" x2="596" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="600,312 593,308 593,316" fill="#e8e8e8"/>

    <!-- Residual add circle -->
    <circle cx="612" cy="312" r="8" fill="#141414" stroke="#e8e8e8" stroke-width="1.2"/>
    <text x="612" y="316" text-anchor="middle" fill="#e8e8e8" font-size="12px">+</text>

    <line x1="620" y1="312" x2="678" y2="312" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="682,312 675,308 675,316" fill="#e8e8e8"/>

    <!-- Skip connection arc over attention row -->
    <path d="M 85 302 Q 350 265 612 302" fill="none"
          stroke="#666" stroke-width="0.9" stroke-dasharray="3,3"/>
    <text x="348" y="271" text-anchor="middle" fill="#666" font-size="9px" font-style="italic">
      skip (residual add)
    </text>

    <!-- Attention branch label -->
    <text x="380" y="360" text-anchor="middle" fill="#fbbf24" font-size="11px">attention sub-block</text>
    <text x="380" y="374" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">~2.4M params / block</text>

    <!-- ==============  MLP ROW  ============== -->
    <!-- y band 400–470 -->

    <!-- Left residual' label -->
    <text x="40"  y="436" fill="#8a8a8a" font-size="10.5px">residual'</text>
    <text x="40"  y="449" fill="#666"    font-size="9px">(T, 768)</text>

    <!-- Right residual'' label -->
    <text x="720" y="436" text-anchor="end" fill="#8a8a8a" font-size="10.5px">residual''</text>
    <text x="720" y="449" text-anchor="end" fill="#666"    font-size="9px">(T, 768)</text>

    <!-- Input arrow -->
    <line x1="92" y1="432" x2="180" y2="432" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="184,432 177,428 177,436" fill="#e8e8e8"/>

    <!-- Box M1 : c_fc -->
    <rect x="184" y="412" width="108" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="238" y="429" text-anchor="middle" fill="#e8e8e8" font-size="11px">c_fc</text>
    <text x="238" y="444" text-anchor="middle" fill="#fbbf24" font-size="9.5px">768 → 3072</text>

    <line x1="292" y1="432" x2="310" y2="432" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="314,432 307,428 307,436" fill="#e8e8e8"/>

    <!-- Box M2 : GELU -->
    <rect x="314" y="412" width="80" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="354" y="429" text-anchor="middle" fill="#e8e8e8" font-size="11px">GELU</text>
    <text x="354" y="444" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">nonlinearity</text>

    <line x1="394" y1="432" x2="410" y2="432" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="414,432 407,428 407,436" fill="#e8e8e8"/>

    <!-- Box M3 : c_proj -->
    <rect x="414" y="412" width="108" height="42" rx="2"
          fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <text x="468" y="429" text-anchor="middle" fill="#e8e8e8" font-size="11px">c_proj</text>
    <text x="468" y="444" text-anchor="middle" fill="#fbbf24" font-size="9.5px">3072 → 768</text>

    <line x1="522" y1="432" x2="596" y2="432" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="600,432 593,428 593,436" fill="#e8e8e8"/>

    <!-- Residual add circle -->
    <circle cx="612" cy="432" r="8" fill="#141414" stroke="#e8e8e8" stroke-width="1.2"/>
    <text x="612" y="436" text-anchor="middle" fill="#e8e8e8" font-size="12px">+</text>

    <line x1="620" y1="432" x2="678" y2="432" stroke="#e8e8e8" stroke-width="1"/>
    <polygon points="682,432 675,428 675,436" fill="#e8e8e8"/>

    <!-- Skip connection arc over MLP row -->
    <path d="M 85 422 Q 350 385 612 422" fill="none"
          stroke="#666" stroke-width="0.9" stroke-dasharray="3,3"/>
    <text x="348" y="391" text-anchor="middle" fill="#666" font-size="9px" font-style="italic">
      skip (residual add)
    </text>

    <!-- MLP branch label -->
    <text x="380" y="480" text-anchor="middle" fill="#fbbf24" font-size="11px">MLP sub-block</text>
    <text x="380" y="494" text-anchor="middle" fill="#8a8a8a" font-size="9.5px">~4.7M params / block</text>

    <!-- Summary line -->
    <text x="380" y="524" text-anchor="middle" fill="#8a8a8a" font-size="10px" font-style="italic">
      one block: ~7.1M params  ·  stacked 12× → ~85M
    </text>
  </g>

</svg>
